<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>My Climate Footprint</title>
  <!-- A house caught in a storm: dark cloud, lightning, rain, floodwater rising around the walls. -->
  <rect width="64" height="64" rx="12" fill="#132430"/>
  <!-- Rain -->
  <g stroke="#9cc7e8" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="26" x2="9" y2="33"/>
    <line x1="52" y1="26" x2="49" y2="33"/>
    <line x1="46" y1="27" x2="43" y2="34"/>
  </g>
  <!-- House -->
  <path d="M18 34 L32 22 L46 34 Z" fill="#e0583d" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="21" y="33" width="22" height="18" fill="#f4ede0" stroke="#1b1b1b" stroke-width="2"/>
  <rect x="29" y="40" width="6" height="11" fill="#2e5a68" stroke="#1b1b1b" stroke-width="1.5"/>
  <!-- Storm cloud -->
  <path d="M14 22 a7 7 0 0 1 3-13 a10 10 0 0 1 19-3 a8 8 0 0 1 14 5 a6 6 0 0 1 0 11 Z" fill="#5b6672" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Lightning -->
  <path d="M35 14 L27 27 L33 27 L29 37 L40 22 L34 22 L38 14 Z" fill="#ffd166" stroke="#1b1b1b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Floodwater -->
  <path d="M4 46 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 V60 a4 4 0 0 1 -4 4 H8 a4 4 0 0 1 -4 -4 Z" fill="#2f7dbf" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8 53 q4 -3 8 0 M28 54 q4 -3 8 0 M46 53 q4 -3 8 0" fill="none" stroke="#bfe3ff" stroke-width="2" stroke-linecap="round"/>
</svg>
